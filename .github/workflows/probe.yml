name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Look at 7-Zip and the self-extractor tools
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles '7-Zip'
          "7-Zip directory exists: $(Test-Path $dir)"
          if (Test-Path $dir) { Get-ChildItem $dir | Select-Object Name, Length | Format-Table }
          "7z on PATH: $((Get-Command 7z -ErrorAction SilentlyContinue).Source)"
          "iexpress: $(Test-Path "$env:SystemRoot\System32\iexpress.exe")"
          "cabarc/makecab: $((Get-Command makecab -ErrorAction SilentlyContinue).Source)"
