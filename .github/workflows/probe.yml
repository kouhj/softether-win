name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' -OutFile 'probe\official.exe'
      - name: Poke our own dialog
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", SetLastError = true)] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);

              public static IntPtr Find(uint pid, string cls)
              {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          if (c.ToString() == cls) { found = h; return false; }
                      }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@
          function Dump([uint32]$pid) {
            $dir = Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dir) { (Get-ChildItem $dir.FullName -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ' ' } else { '-' }
          }
          $p = Start-Process -FilePath 'probe\ours.exe' -PassThru
          Start-Sleep -Seconds 3
          $p.Refresh()
          $dlg = [Win]::Find([uint32]$p.Id, '#32770')
          "before poke: cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2)) dlg=$($dlg -ne [IntPtr]::Zero) files=$(Dump $p.Id)"
          [Win]::PostMessage($dlg, 0x0113, [IntPtr]1, [IntPtr]::Zero) | Out-Null
          for ($i = 0; $i -lt 8; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            $kids = (Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | Measure-Object).Count
            $childDlg = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)") | ForEach-Object { [Win]::Find([uint32]$_.ProcessId, '#32770') -ne [IntPtr]::Zero }
            "t=$($i+1) cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2)) kids=$kids kidDlg=$childDlg exited=$($p.HasExited) files=$(Dump $p.Id)"
          }
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object {
            $c = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue
            "child $($_.Name) cpu=$([math]::Round($c.TotalProcessorTime.TotalSeconds,2))"
          }
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Resolve the win32u offsets
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Exp
          {
              [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern IntPtr LoadLibraryW(string path);
              [DllImport("kernel32.dll")]
              static extern IntPtr GetProcAddress(IntPtr module, string name);
              [DllImport("psapi.dll", CharSet = CharSet.Unicode)]
              static extern uint GetModuleFileNameEx(IntPtr process, IntPtr module, StringBuilder name, uint size);
              [DllImport("kernel32.dll")]
              static extern IntPtr GetModuleHandleW(string name);

              public static void Nearest(string dll, long[] offsets)
              {
                  IntPtr h = LoadLibraryW(dll);
                  var names = new List<string>();
                  IntPtr p = GetProcAddress(h, "NtUserGetMessage");
                  foreach (long off in offsets)
                  {
                      long best = -1;
                      string bestName = null;
                      foreach (string n in new[] { "NtUserPeekMessage", "NtUserGetMessage", "NtUserMessageCall", "NtUserDispatchMessage", "NtUserCallOneParam", "NtUserCallTwoParam", "NtUserSetTimer", "NtUserGetDC", "NtUserBeginPaint", "NtUserEndPaint", "NtUserInvalidateRect", "NtUserRedrawWindow", "NtUserSetWindowPos", "NtUserGetUpdateRect", "NtUserInternalGetWindowText" })
                      {
                          IntPtr a = GetProcAddress(h, n);
                          long rel = a.ToInt64() - h.ToInt64();
                          if (rel <= off && rel > best) { best = rel; bestName = n; }
                      }
                      "  win32u+0x{0:x} is after {1}+0x{2:x} (delta 0x{3:x})" -f off, bestName, best, off - best
                  }
              }
          }
          '@
          [Exp]::Nearest('win32u.dll', @(0x18c4, 0x12c4))

      - name: Run official for the control
        shell: pwsh
        run: |
          Start-Process -FilePath 'probe\official.exe' | Out-Null
          Start-Sleep -Seconds 2
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | ForEach-Object { "child cpu=$([math]::Round($_.TotalProcessorTime.TotalSeconds,2)) windows=$($_.MainWindowTitle)" }
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
