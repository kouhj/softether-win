name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch the installers from the newest build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-win.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "using the installers of $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n softether-installers-5.2.5189 -D new
          ls -l new
      - name: Run the installer
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);

              public static string Dump(uint pid)
              {
                  var list = new List<string>();
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          var t = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          GetWindowTextW(h, t, 256);
                          list.Add(c.ToString() + " | " + t.ToString() + " | visible=" + IsWindowVisible(h));
                      }
                      return true;
                  }, IntPtr.Zero);
                  return list.Count == 0 ? "no window" : string.Join(" ;; ", list);
              }
          }
          '@
          function Show-Temp([string]$label) {
            Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              "$label $($_.Name): " + ((Get-ChildItem $_.FullName -File | Sort-Object Name | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ' ')
            }
          }
          Remove-Item (Join-Path $env:TEMP 'VPN_*') -Recurse -Force -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem 'new' -Filter 'softether-vpnclient-*.exe' | Select-Object -First 1).FullName
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          Show-Temp 'parent'
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($proc.Id)" | Select-Object -First 1
          if ($child) {
            $cp = Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 4; $i++) {
              Start-Sleep -Seconds 1
              $cp.Refresh()
              "child t=$($i+1)s cpu=$([math]::Round($cp.TotalProcessorTime.TotalSeconds,2)) exited=$($cp.HasExited) -> $([Win]::Dump([uint32]$cp.Id))"
            }
            "child command line: $($child.CommandLine)"
          }
          else { "no child" }
          Show-Temp 'after'
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          # run the setup program from the extracted directory by hand
          $dir = Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -First 1
          if ($dir) {
            "manual run from $($dir.FullName)"
            $setup = Join-Path $dir.FullName 'vpnsetup.exe'
            if (Test-Path $setup) {
              $m = Start-Process -FilePath $setup -ArgumentList "/CALLERSFXPATH:`"$(Join-Path $dir.FullName 'installer.cache')`"", '/ISEASYINSTALLER:0' -WorkingDirectory $dir.FullName -PassThru
              for ($i = 0; $i -lt 4; $i++) {
                Start-Sleep -Seconds 1
                $m.Refresh()
                "manual t=$($i+1)s cpu=$([math]::Round($m.TotalProcessorTime.TotalSeconds,2)) exited=$($m.HasExited) code=$($m.ExitCode) -> $([Win]::Dump([uint32]$m.Id))"
              }
              Stop-Process -Id $m.Id -Force -ErrorAction SilentlyContinue
            }
          }
