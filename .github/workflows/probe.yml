name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Get the tools from the last successful build
        uses: actions/download-artifact@v4
        with:
          name: softether-win-5.2.5189
          path: out
          run-id: 42617987144
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Watch the generator work
        shell: pwsh
        run: |
          $exe = (Resolve-Path out\vpnsetup.exe).Path
          $dir = Split-Path -Parent $exe
          Set-Location $dir
          $temp = $env:TEMP
          "temp is $temp"

          Start-Process -FilePath $exe -ArgumentList @('/SFXMODE:vpnclient', "/SFXOUT:$dir\A.exe") `
            -WorkingDirectory $dir -PassThru | Out-Null

          for ($i = 1; $i -le 36; $i++) {
            Start-Sleep -Seconds 10
            $f = Get-ChildItem $temp -Filter setup.exe -Recurse -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            $size = if ($f) { '{0:N0}' -f $f.Length } else { '-' }
            $out = Test-Path "$dir\A.exe"
            '{0,4}s  temp/setup.exe={1,12}  A.exe={2}' -f ($i * 10), $size, $out
            if ($out) { break }
          }

          Get-Process vpnsetup -ErrorAction SilentlyContinue |
            Select-Object Id, Responding, MainWindowTitle, CPU, Handles,
              @{n = 'Threads'; e = { $_.Threads.Count } } | Format-List | Out-String
          Get-CimInstance Win32_Process -Filter "name='vpnsetup.exe'" |
            Select-Object CommandLine | Format-List | Out-String
          if (Test-Path "$dir\A.exe") { 'A.exe size: ' + (Get-Item "$dir\A.exe").Length }
          Stop-Process -Name vpnsetup -Force -ErrorAction SilentlyContinue
