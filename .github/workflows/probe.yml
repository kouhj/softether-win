name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' `
            -OutFile 'probe\ours.exe'

      - name: Walk the spinning stack
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public class Tool
          {
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern IntPtr OpenThread(uint access, bool inherit, uint tid);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern uint SuspendThread(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern uint ResumeThread(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool CloseHandle(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool GetThreadContext(IntPtr hThread, IntPtr lpContext);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool ReadProcessMemory(IntPtr h, IntPtr addr, byte[] buf, IntPtr size, out IntPtr read);

              public static ulong[] Where(uint tid)
              {
                  IntPtr h = OpenThread(0x0002 | 0x0008 | 0x0040, false, tid);
                  if (h == IntPtr.Zero) return null;
                  try
                  {
                      if (SuspendThread(h) == 0xFFFFFFFF) return null;
                      try
                      {
                          IntPtr raw = Marshal.AllocHGlobal(0x600);
                          try
                          {
                              IntPtr p = new IntPtr((raw.ToInt64() + 15) & ~15L);
                              for (int i = 0; i < 0x600; i++) Marshal.WriteByte(p, i, 0);
                              Marshal.WriteInt32(p, 0x30, unchecked((int)0x00100001));
                              if (!GetThreadContext(h, p)) return null;
                              return new ulong[] { (ulong)Marshal.ReadInt64(p, 0xF8), (ulong)Marshal.ReadInt64(p, 0x98) };
                          }
                          finally { Marshal.FreeHGlobal(raw); }
                      }
                      finally { ResumeThread(h); }
                  }
                  finally { CloseHandle(h); }
              }

              public static long[] Read(IntPtr process, ulong address, int count)
              {
                  byte[] buf = new byte[count * 8];
                  IntPtr read;
                  if (!ReadProcessMemory(process, new IntPtr((long)address), buf, new IntPtr(buf.Length), out read)) return null;
                  long[] values = new long[read.ToInt64() / 8];
                  for (int i = 0; i < values.Length; i++) values[i] = BitConverter.ToInt64(buf, i * 8);
                  return values;
              }
          }
          '@

          function Resolve($p, [long]$address) {
            foreach ($m in $p.Modules) {
              $b = $m.BaseAddress.ToInt64()
              if ($address -ge $b -and $address -lt $b + $m.ModuleMemorySize) {
                return ('{0}+0x{1:x}' -f $m.ModuleName, ($address - $b))
              }
            }
            return $null
          }

          $p = Start-Process -FilePath 'probe\ours.exe' -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          $t = $p.Threads | Where-Object { $_.ThreadState -eq 'Running' } | Select-Object -First 1
          "cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2))s running-thread=$($t.Id)"
          $w = [Tool]::Where([uint32]$t.Id)
          "rip=$(Resolve $p ([long]$w[0])) rsp=0x$($w[1].ToString('x'))"
          $words = [Tool]::Read($p.Handle, $w[1], 128)
          $seen = 0
          for ($i = 0; $i -lt $words.Length; $i++) {
            $r = Resolve $p $words[$i]
            if ($r) { "  [rsp+0x{0:x}] {1}" -f ($i * 8), $r; $seen++ }
            if ($seen -ge 14) { break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
