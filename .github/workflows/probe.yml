name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch both installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' `
            -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' `
            -OutFile 'probe\official.exe'
          Get-ChildItem probe | ForEach-Object { "{0} {1}" -f $_.Name, $_.Length }

      - name: Run them and look
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class WinEnum
          {
              delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
              [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr l);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);

              static string Text(IntPtr h)
              {
                  StringBuilder sb = new StringBuilder(2048);
                  GetWindowTextW(h, sb, sb.Capacity);
                  return sb.ToString();
              }

              static string Cls(IntPtr h)
              {
                  StringBuilder sb = new StringBuilder(256);
                  GetClassNameW(h, sb, sb.Capacity);
                  return sb.ToString();
              }

              public static List<string> Dump(uint pid)
              {
                  List<string> list = new List<string>();
                  EnumWindows((h, l) =>
                  {
                      uint wpid;
                      GetWindowThreadProcessId(h, out wpid);
                      if (wpid != pid) return true;
                      string line = "top \"" + Text(h) + "\" class=" + Cls(h) + " visible=" + IsWindowVisible(h);
                      EnumChildWindows(h, (c, l2) =>
                      {
                          line += " | child \"" + Text(c) + "\" class=" + Cls(c);
                          return true;
                      }, IntPtr.Zero);
                      list.Add(line);
                      return true;
                  }, IntPtr.Zero);
                  return list;
              }
          }
          '@

          function Run-Probe([string]$exe, [string]$label) {
            "=== $label"
            Get-ChildItem $env:TEMP -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'vpn|hamcore|installer\.cache|setup' } |
              Remove-Item -Force -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -PassThru
            for ($i = 0; $i -lt 8; $i++) {
              Start-Sleep -Seconds 5
              $p.Refresh()
              if ($p.HasExited) { "  [${i}] exited code=$($p.ExitCode)"; break }
              "  [${i}] cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2))s threads=$($p.Threads.Count) ws=$([math]::Round($p.WorkingSet64/1MB,1))MB"
            }
            "  windows:"
            [WinEnum]::Dump([uint32]$p.Id) | ForEach-Object { "    $_" }
            "  temp files:"
            Get-ChildItem $env:TEMP -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'vpn|hamcore|installer\.cache|setup' } |
              ForEach-Object { "    {0} {1}" -f $_.Name, $_.Length }
            "  children:"
            Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
              ForEach-Object { "    $($_.ProcessId) $($_.Name) $($_.CommandLine)" }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 2
            Get-Process -Name vpnsetup,vpnclient,vpncmgr,vpnserver -ErrorAction SilentlyContinue | Stop-Process -Force
          }

          Run-Probe 'probe\official.exe' 'official 5.02.5187'
          Run-Probe 'probe\ours.exe' 'ours 5.02.5189'
