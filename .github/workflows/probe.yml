name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch the newest installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-win.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "using the installers of $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n softether-installers-5.2.5189 -D new
          ls -l new
      - name: Trace the setup flow
        shell: pwsh
        run: |
          $env:SOFTETHER_SETUP_TRACE = 'C:\trace.txt'
          $exe = (Get-ChildItem new\softether-vpnclient-*.exe | Select-Object -First 1).FullName
          "installer: $exe"
          Remove-Item $env:SOFTETHER_SETUP_TRACE -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:TEMP 'VPN_*') -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          'trace:'
          if (Test-Path $env:SOFTETHER_SETUP_TRACE) { Get-Content $env:SOFTETHER_SETUP_TRACE } else { 'no trace' }
          Get-CimInstance Win32_Process -Filter "Name='vpnsetup.exe' OR Name='vpncmgr.exe' OR Name='vpncmd.exe' OR Name='vpnclient.exe'" | ForEach-Object { "proc $($_.ProcessId) $($_.Name): $($_.CommandLine)" }
          Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory | ForEach-Object { "dir $($_.Name): " + ((Get-ChildItem $_.FullName | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ' ') }
          Get-Process -Name vpnsetup,vpncmgr,vpnclient,vpncmd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
