name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch the installers from the newest build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-win.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "using the installers of $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n softether-installers-5.2.5189 -D new
          ls -l new
      - name: Run the installer
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);

              public static string Dump(uint pid)
              {
                  var list = new List<string>();
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          var t = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          GetWindowTextW(h, t, 256);
                          list.Add(c.ToString() + " | " + t.ToString() + " | visible=" + IsWindowVisible(h));
                      }
                      return true;
                  }, IntPtr.Zero);
                  return list.Count == 0 ? "no window" : string.Join(" ;; ", list);
              }
          }
          '@
          $env:SOFTETHER_SFX_TRACE = (Join-Path (Get-Location) 'sfx.txt')
          Remove-Item $env:SOFTETHER_SFX_TRACE -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:TEMP 'VPN_*') -Recurse -Force -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem 'new' -Filter 'softether-vpnclient-*.exe' | Select-Object -First 1).FullName
          "installer: $exe $((Get-Item $exe).Length) bytes"
          $proc = Start-Process -FilePath $exe -PassThru
          for ($i = 0; $i -lt 4; $i++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            "t=$($i+1)s cpu=$([math]::Round($proc.TotalProcessorTime.TotalSeconds,2)) exited=$($proc.HasExited) -> $([Win]::Dump([uint32]$proc.Id))"
          }
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($proc.Id)" | Select-Object -First 1
          if ($child) { Start-Sleep -Seconds 2; "child $($child.Name) -> $([Win]::Dump([uint32]$child.ProcessId))" }
          $dir = Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dir) { "temp $($dir.Name): " + ((Get-ChildItem $dir.FullName -File | Sort-Object Name | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ' ') }
          if (Test-Path $env:SOFTETHER_SFX_TRACE) {
            $lines = Get-Content $env:SOFTETHER_SFX_TRACE
            "trace: $($lines.Count) messages, first 30: $($lines[0..([Math]::Min(29, $lines.Count - 1))] -join ', ')"
          }
          else { "trace: no log" }
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
