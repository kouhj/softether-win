name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch the installer and the archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' `
            -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-win-5.2.5189-x64.zip' `
            -OutFile 'probe\win.zip'
          Expand-Archive 'probe\win.zip' -DestinationPath 'probe\zip' -Force
          Get-ChildItem 'probe\zip' -Recurse -File | ForEach-Object { "{0} {1}" -f $_.Name, $_.Length }

      - name: Where does the thread spin
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public class Sampler
          {
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr OpenThread(uint access, bool inherit, uint tid);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint SuspendThread(IntPtr h);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint ResumeThread(IntPtr h);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool CloseHandle(IntPtr h);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool GetThreadContext(IntPtr hThread, IntPtr lpContext);

              public static string Sample(uint tid, ulong moduleBase)
              {
                  const uint THREAD_SUSPEND_RESUME = 0x0002;
                  const uint THREAD_GET_CONTEXT = 0x0008;
                  const uint THREAD_QUERY_INFORMATION = 0x0040;
                  const uint CONTEXT_CONTROL = 0x00100001;
                  IntPtr h = OpenThread(THREAD_SUSPEND_RESUME | THREAD_GET_CONTEXT | THREAD_QUERY_INFORMATION, false, tid);
                  if (h == IntPtr.Zero) return "open failed " + Marshal.GetLastWin32Error();
                  try
                  {
                      uint prev = SuspendThread(h);
                      if (prev == 0xFFFFFFFF) return "suspend failed " + Marshal.GetLastWin32Error();
                      try
                      {
                          IntPtr raw = Marshal.AllocHGlobal(0x600);
                          try
                          {
                              long aligned = (raw.ToInt64() + 15) & ~15L;
                              IntPtr p = new IntPtr(aligned);
                              for (int i = 0; i < 0x600; i++) Marshal.WriteByte(p, i, 0);
                              Marshal.WriteInt32(p, 0x30, unchecked((int)CONTEXT_CONTROL));
                              if (!GetThreadContext(h, p)) return "context failed " + Marshal.GetLastWin32Error();
                              long rip = Marshal.ReadInt64(p, 0xF8);
                              long rsp = Marshal.ReadInt64(p, 0x98);
                              return string.Format("rip=+0x{0:x} rsp=0x{1:x}", rip - (long)moduleBase, rsp);
                          }
                          finally { Marshal.FreeHGlobal(raw); }
                      }
                      finally { ResumeThread(h); }
                  }
                  finally { CloseHandle(h); }
              }
          }
          '@

          function Watch([string]$exe, [string]$label) {
            "=== $label"
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) { "  exited code=$($p.ExitCode)"; return }
            $base = [uint64]$p.MainModule.BaseAddress.ToInt64()
            "  base=0x{0:x} cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2))s" -f $base
            foreach ($t in $p.Threads) {
              $s = $null
              try { $s = [Sampler]::Sample([uint32]$t.Id, $base) } catch { $s = "error $($_.Exception.Message)" }
              "  thread {0} {1} {2}" -f $t.Id, $t.ThreadState, $s
            }
            Get-ChildItem $env:TEMP -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'VPN_' } |
              Select-Object -First 8 | ForEach-Object { "  temp {0} {1}" -f $_.Name, $_.Length }
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 1
            Get-Process -Name vpnsetup,vpnclient,vpncmgr -ErrorAction SilentlyContinue | Stop-Process -Force
          }

          Watch 'probe\ours.exe' 'our installer'
          $setup = (Get-ChildItem 'probe\zip' -Recurse -Filter vpnsetup.exe | Select-Object -First 1).FullName
          Watch $setup 'our vpnsetup.exe alone'
