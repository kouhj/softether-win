name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' `
            -OutFile 'probe\ours.exe'
          Get-ChildItem probe | ForEach-Object { "{0} {1}" -f $_.Name, $_.Length }

      - name: Enumerate the resource table of the file
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Res
          {
              public delegate bool EnumProc(IntPtr hModule, IntPtr type, IntPtr name, IntPtr lParam);

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryExW(string file, IntPtr h, int flags);

              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool FreeLibrary(IntPtr h);

              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true)]
              public static extern bool EnumResourceNamesA(IntPtr hModule, string type, EnumProc proc, IntPtr lParam);

              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true)]
              static extern IntPtr FindResourceA(IntPtr hModule, IntPtr name, string type);

              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint SizeofResource(IntPtr hModule, IntPtr hr);

              public static List<string> Names(string file, IntPtr hModule)
              {
                  List<string> list = new List<string>();
                  EnumResourceNamesA(hModule, "DATAFILE", (m, t, n, l) =>
                  {
                      if (((long)n >> 16) == 0)
                      {
                          list.Add("id " + n.ToInt64());
                          return true;
                      }
                      string name = Marshal.PtrToStringAnsi(n);
                      IntPtr hr = FindResourceA(m, n, "DATAFILE");
                      uint size = hr == IntPtr.Zero ? 0 : SizeofResource(m, hr);
                      list.Add(name + " " + size);
                      return true;
                  }, IntPtr.Zero);
                  return list;
              }
          }
          '@
          $m = [Res]::LoadLibraryExW((Resolve-Path 'probe\ours.exe'), [IntPtr]::Zero, 2)
          "module=$m"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $job = Start-Job -ScriptBlock { param($m) [Res]::Names('x', [IntPtr]$m) } -ArgumentList $m
          if (Wait-Job $job -Timeout 30) {
            $names = Receive-Job $job
            "enumeration: $($names.Count) entries in $([math]::Round($sw.Elapsed.TotalSeconds,2))s"
            $names | ForEach-Object { "  $_" }
          } else {
            "enumeration still running after 30s: the resource directory loops"
            Stop-Job $job
          }
          [Res]::FreeLibrary($m) | Out-Null

      - name: Run it and watch what it writes
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public class Io
          {
              [StructLayout(LayoutKind.Sequential)]
              public struct IO_COUNTERS
              {
                  public ulong ReadOperationCount;
                  public ulong WriteOperationCount;
                  public ulong OtherOperationCount;
                  public ulong ReadTransferCount;
                  public ulong WriteTransferCount;
                  public ulong OtherTransferCount;
              }
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool GetProcessIoCounters(IntPtr h, out IO_COUNTERS c);
          }
          '@
          $p = Start-Process -FilePath 'probe\ours.exe' -PassThru
          for ($i = 0; $i -lt 5; $i++) {
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) { "  [${i}] exited code=$($p.ExitCode)"; break }
            $c = New-Object Io+IO_COUNTERS
            [Io]::GetProcessIoCounters($p.Handle, [ref]$c) | Out-Null
            "  [${i}] cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2))s threads=$($p.Threads.Count) writes=$($c.WriteOperationCount) written=$($c.WriteTransferCount) reads=$($c.ReadOperationCount) read=$($c.ReadTransferCount)"
            Get-ChildItem $env:TEMP -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'VPN_|hamcore|vpnsetup' } |
              Select-Object -First 12 |
              ForEach-Object { "      {0} {1}" -f $_.FullName, $_.Length }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process -Name vpnsetup,vpnclient,vpncmgr -ErrorAction SilentlyContinue | Stop-Process -Force
