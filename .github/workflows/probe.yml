name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch the published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 5.2.5189 -R kouhj/softether-win -p 'softether-vpnclient-5.02.5189.x64.exe' -D rel
          Get-ChildItem rel | Format-Table Name, Length

      - name: Run it
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class W {
              public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              public static string[] Dump(uint wanted) {
                  var list = new System.Collections.Generic.List<string>();
                  EnumWindows(delegate(IntPtr h, IntPtr l) {
                      uint pid; GetWindowThreadProcessId(h, out pid);
                      if (pid == wanted) {
                          var t = new StringBuilder(512); GetWindowTextW(h, t, 512);
                          var c = new StringBuilder(256); GetClassNameW(h, c, 256);
                          list.Add(c.ToString() + " | " + t.ToString() + " | visible=" + IsWindowVisible(h));
                      }
                      return true;
                  }, IntPtr.Zero);
                  return list.ToArray();
              }
          }
          '@
          $exe = (Get-ChildItem rel\*.exe).FullName
          $p = Start-Process $exe -PassThru
          Write-Host "started $($p.Id)"
          for ($i = 1; $i -le 3; $i++) {
              Start-Sleep -Seconds 2
              Write-Host "== t+$($i * 2)s cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds, 2)) alive=$(-not $p.HasExited)"
              [W]::Dump([uint32]$p.Id) | ForEach-Object { Write-Host "  self: $_" }
              $kids = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)"
              foreach ($k in $kids) {
                  Write-Host "  child: $($k.ProcessId) $($k.CommandLine)"
                  [W]::Dump([uint32]$k.ProcessId) | ForEach-Object { Write-Host "    win: $_" }
              }
          }
          Get-ChildItem $env:TEMP -Directory -Filter 'VPN_*' | ForEach-Object {
              Write-Host "dir: $($_.Name)"
              Get-ChildItem $_.FullName | ForEach-Object { Write-Host "  $($_.Name):$($_.Length)" }
          }
