name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' `
            -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-win-5.2.5189-x64.zip' `
            -OutFile 'probe\win.zip'
          Expand-Archive 'probe\win.zip' -DestinationPath 'probe\zip' -Force

      - name: Symbolise the spinning thread
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public class Tool
          {
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr OpenThread(uint access, bool inherit, uint tid);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint SuspendThread(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint ResumeThread(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool CloseHandle(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool GetThreadContext(IntPtr hThread, IntPtr lpContext);

              [DllImport("dbghelp.dll", SetLastError = true)]
              public static extern uint SymSetOptions(uint options);
              [DllImport("dbghelp.dll", SetLastError = true)]
              public static extern bool SymInitialize(IntPtr hProcess, string path, bool invade);
              [DllImport("dbghelp.dll", SetLastError = true)]
              public static extern bool SymFromAddr(IntPtr hProcess, ulong address, out ulong disp, IntPtr symbol);

              public static ulong Rip(uint tid)
              {
                  IntPtr h = OpenThread(0x0002 | 0x0008 | 0x0040, false, tid);
                  if (h == IntPtr.Zero) return 0;
                  try
                  {
                      if (SuspendThread(h) == 0xFFFFFFFF) return 0;
                      try
                      {
                          IntPtr raw = Marshal.AllocHGlobal(0x600);
                          try
                          {
                              IntPtr p = new IntPtr((raw.ToInt64() + 15) & ~15L);
                              for (int i = 0; i < 0x600; i++) Marshal.WriteByte(p, i, 0);
                              Marshal.WriteInt32(p, 0x30, unchecked((int)0x00100001));
                              if (!GetThreadContext(h, p)) return 0;
                              return (ulong)Marshal.ReadInt64(p, 0xF8);
                          }
                          finally { Marshal.FreeHGlobal(raw); }
                      }
                      finally { ResumeThread(h); }
                  }
                  finally { CloseHandle(h); }
              }

              public static string Symbol(IntPtr process, ulong address)
              {
                  IntPtr buf = Marshal.AllocHGlobal(88 + 2048);
                  try
                  {
                      for (int i = 0; i < 88; i++) Marshal.WriteByte(buf, i, 0);
                      Marshal.WriteInt32(buf, 0, 88);
                      Marshal.WriteInt32(buf, 80, 2000);
                      ulong disp;
                      if (!SymFromAddr(process, address, out disp, buf))
                          return "no symbol, error " + Marshal.GetLastWin32Error();
                      string name = Marshal.PtrToStringAnsi(new IntPtr(buf.ToInt64() + 84));
                      return name + "+0x" + disp.ToString("x");
                  }
                  finally { Marshal.FreeHGlobal(buf); }
              }
          }
          '@

          [Tool]::SymSetOptions(0x00000002 -bor 0x00000004 -bor 0x00000200) | Out-Null
          $p = Start-Process -FilePath 'probe\ours.exe' -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          "cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2))s threads=$($p.Threads.Count)"
          $ok = [Tool]::SymInitialize($p.Handle, 'srv*C:\sym*https://msdl.microsoft.com/download/symbols', $false)
          "syminitialize=$ok error=$([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          foreach ($t in $p.Threads) {
            $rip = [Tool]::Rip([uint32]$t.Id)
            $mod = $null
            foreach ($m in $p.Modules) {
              $b = [uint64]$m.BaseAddress.ToInt64()
              if ($rip -ge $b -and $rip -lt $b + [uint64]$m.ModuleMemorySize) { $mod = $m; break }
            }
            if ($null -eq $mod) { "  thread $($t.Id) $($t.ThreadState) rip=0x$($rip.ToString('x')) outside" ; continue }
            $mb = [uint64]$mod.BaseAddress.ToInt64()
            $sym = ''
            if ($t.ThreadState -eq 'Running') { $sym = [Tool]::Symbol($p.Handle, $rip) }
            "  thread {0} {1} {2}+0x{3:x} {4}" -f $t.Id, $t.ThreadState, $mod.ModuleName, ($rip - $mb), $sym
          }
          Stop-Process -Id $p.Id -Force
          Get-Process -Name vpnsetup,vpnclient,vpncmgr -ErrorAction SilentlyContinue | Stop-Process -Force
