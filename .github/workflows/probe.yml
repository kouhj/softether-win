name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' -OutFile 'probe\official.exe'
      - name: Compare the extracted setup programs
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll", SetLastError = true)] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);

              public static IntPtr Find(uint pid, string cls)
              {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          if (c.ToString() == cls) { found = h; return false; }
                      }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }

              public static string Dump(uint pid)
              {
                  var list = new List<string>();
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          var t = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          GetWindowTextW(h, t, 256);
                          list.Add(c.ToString() + " | " + t.ToString() + " | visible=" + IsWindowVisible(h));
                      }
                      return true;
                  }, IntPtr.Zero);
                  return list.Count == 0 ? "no window" : string.Join(" ;; ", list);
              }
          }
          '@
          # 1. the official child wizard
          $official = Start-Process -FilePath 'probe\official.exe' -PassThru
          Start-Sleep -Seconds 3
          $c1 = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($official.Id)" | Select-Object -First 1
          if ($c1) {
            Start-Sleep -Seconds 2
            "official child: $($c1.Name) -> $([Win]::Dump([uint32]$c1.ProcessId))"
          }
          Stop-Process -Id $official.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $official_dir = (Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory | Select-Object -First 1).FullName
          "official temp: $official_dir"
          # 2. the official setup program run directly
          $o = Start-Process -FilePath (Join-Path $official_dir 'vpnsetup.exe') -WorkingDirectory $official_dir -PassThru
          Start-Sleep -Seconds 5
          "official direct: cpu=$([math]::Round($o.TotalProcessorTime.TotalSeconds,2)) exited=$($o.HasExited) -> $([Win]::Dump([uint32]$o.Id))"
          Stop-Process -Id $o.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item (Join-Path $env:TEMP 'VPN_*') -Recurse -Force -ErrorAction SilentlyContinue
          # 3. extract our payload and run our setup program
          $ours = Start-Process -FilePath 'probe\ours.exe' -PassThru
          Start-Sleep -Seconds 2
          [Win]::PostMessage([Win]::Find([uint32]$ours.Id, '#32770'), 0x0113, [IntPtr]1, [IntPtr]::Zero) | Out-Null
          Start-Sleep -Seconds 4
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $ours.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $ours_dir = (Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory | Select-Object -First 1).FullName
          "ours temp: $ours_dir"
          $v = Start-Process -FilePath (Join-Path $ours_dir 'vpncmd.exe') -ArgumentList 'localhost','/CMD','Version' -WorkingDirectory (Join-Path (Get-Location) 'probe') -RedirectStandardOutput 'probe\vpncmd.out' -RedirectStandardError 'probe\vpncmd.err' -PassThru -NoNewWindow
          $v.WaitForExit(20000) | Out-Null
          "vpncmd exit=$($v.ExitCode)"
          "vpncmd out: $((Get-Content 'probe\vpncmd.out' -ErrorAction SilentlyContinue) -join ' / ')"
          "vpncmd err: $((Get-Content 'probe\vpncmd.err' -ErrorAction SilentlyContinue) -join ' / ')"
          $w = Start-Process -FilePath (Join-Path $ours_dir 'vpnsetup.exe') -WorkingDirectory $ours_dir -PassThru
          for ($i = 0; $i -lt 6; $i++) {
            Start-Sleep -Seconds 2
            $w.Refresh()
            "ours setup t=$($i*2+2) cpu=$([math]::Round($w.TotalProcessorTime.TotalSeconds,2)) exited=$($w.HasExited) -> $([Win]::Dump([uint32]$w.Id))"
          }
          Stop-Process -Id $w.Id -Force -ErrorAction SilentlyContinue
