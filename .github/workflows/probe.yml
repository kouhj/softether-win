name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' -OutFile 'probe\official.exe'

      - name: List every window of both installers
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, Proc p, IntPtr l);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetDlgCtrlID(IntPtr h);

              public static System.Collections.Generic.List<string> Dump(uint pid)
              {
                  var lines = new System.Collections.Generic.List<string>();
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          lines.Add(Describe(h, ""));
                          EnumChildWindows(h, (c, l2) => { lines.Add(Describe(c, "    ")); return true; }, IntPtr.Zero);
                      }
                      return true;
                  }, IntPtr.Zero);
                  return lines;
              }

              static string Describe(IntPtr h, string indent)
              {
                  var cls = new StringBuilder(256);
                  var txt = new StringBuilder(1024);
                  GetClassNameW(h, cls, 256);
                  GetWindowTextW(h, txt, 1024);
                  return string.Format("{0}{1} id={2} visible={3} class={4} text={5}",
                      indent, h.ToString("x"), GetDlgCtrlID(h), IsWindowVisible(h), cls, txt.ToString().Replace("\r", " ").Replace("\n", " "));
              }
          }
          '@

          function Look([string]$exe, [string]$label) {
            "=== $label"
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 8
            $p.Refresh()
            "  cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2))s exited=$($p.HasExited)"
            if (-not $p.HasExited) {
              [Win]::Dump([uint32]$p.Id) | ForEach-Object { "  W $_" }
              Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
                ForEach-Object { "  child $($_.ProcessId) $($_.CommandLine)" }
              $t = Join-Path $env:TEMP 'VPN_*'
              Get-ChildItem $t -ErrorAction SilentlyContinue | ForEach-Object {
                "  temp $($_.Name)"
                Get-ChildItem $_.FullName -ErrorAction SilentlyContinue | ForEach-Object { "    $($_.Name) $($_.Length)" }
              }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process -Name vpnsetup,vpnclient,vpncmgr -ErrorAction SilentlyContinue | Stop-Process -Force
            Remove-Item (Join-Path $env:TEMP 'VPN_*') -Recurse -Force -ErrorAction SilentlyContinue
          }

          Look 'probe\official.exe' 'official'
          Look 'probe\ours.exe' 'ours'
