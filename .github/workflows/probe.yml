name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' -OutFile 'probe\official.exe'
      - name: Decode the payload ourselves
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Res
          {
              public delegate bool EnumProc(IntPtr h, IntPtr type, IntPtr name, IntPtr param);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true)]
              public static extern bool EnumResourceNamesA(IntPtr h, string type, EnumProc proc, IntPtr param);
              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true)]
              public static extern IntPtr FindResourceA(IntPtr h, string name, string type);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern uint SizeofResource(IntPtr h, IntPtr res);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern IntPtr LoadResource(IntPtr h, IntPtr res);
              [DllImport("kernel32.dll")]
              public static extern IntPtr LockResource(IntPtr data);
          }
          '@
          $h = [Res]::LoadLibraryExW((Resolve-Path 'probe\ours.exe').Path, [IntPtr]::Zero, 2)
          if ($h -eq [IntPtr]::Zero) { throw "cannot load the installer: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $names = [System.Collections.Generic.List[string]]::new()
          [Res]::EnumResourceNamesA($h, 'DATAFILE', { param($m, $t, $n, $l) $names.Add($n); return $true }, [IntPtr]::Zero) | Out-Null
          foreach ($name in $names) {
            $res = [Res]::FindResourceA($h, $name, 'DATAFILE')
            $size = [Res]::SizeofResource($h, $res)
            $data = [Res]::LoadResource($h, $res)
            $locked = [Res]::LockResource($data)
            $bytes = [byte[]]::new($size)
            [Runtime.InteropServices.Marshal]::Copy($locked, $bytes, 0, $size)
            if ($name -like 'RAW_*') { "resource $name raw $size"; continue }
            $declared = [BitConverter]::ToUInt32($bytes, 0)
            $ms = [System.IO.MemoryStream]::new($bytes, 4, $bytes.Length - 4)
            $z = [System.IO.Compression.ZLibStream]::new($ms, [System.IO.Compression.CompressionMode]::Decompress)
            $out = [System.IO.MemoryStream]::new()
            try { $z.CopyTo($out); "resource $name declared=$declared decoded=$($out.Length)" }
            catch { "resource $name declared=$declared FAILED: $($_.Exception.InnerException.Message) $($_.Exception.Message)" }
            $z.Dispose()
          }
