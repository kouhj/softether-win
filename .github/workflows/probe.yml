name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' -OutFile 'probe\official.exe'
      - name: Poke, then inspect
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll", SetLastError = true)] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);

              public static IntPtr Find(uint pid, string cls)
              {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          if (c.ToString() == cls) { found = h; return false; }
                      }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }

              public static List<string> Windows(uint pid)
              {
                  var list = new List<string>();
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          var t = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          GetWindowTextW(h, t, 256);
                          list.Add(c.ToString() + " | " + t.ToString() + " | visible=" + IsWindowVisible(h));
                      }
                      return true;
                  }, IntPtr.Zero);
                  return list;
              }
          }
          '@
          function Files([string]$dir) {
            if (-not $dir) { return '-' }
            (Get-ChildItem $dir -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ' '
          }
          $p = Start-Process -FilePath 'probe\ours.exe' -PassThru
          Start-Sleep -Seconds 2
          $dlg = [Win]::Find([uint32]$p.Id, '#32770')
          [Win]::PostMessage($dlg, 0x0113, [IntPtr]1, [IntPtr]::Zero) | Out-Null
          Start-Sleep -Seconds 6
          $dir = (Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
          "parent windows:"; [Win]::Windows([uint32]$p.Id) | ForEach-Object { "  $_" }
          "temp: $(Files $dir.FullName)"
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | Select-Object -First 1
          if ($child) {
            "child: $($child.Name) $($child.CommandLine)"
            $cp = Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
            "child cpu=$([math]::Round($cp.TotalProcessorTime.TotalSeconds,2))"
            "child windows:"; [Win]::Windows([uint32]$child.ProcessId) | ForEach-Object { "  $_" }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          "--- run the extracted vpnsetup.exe directly"
          $tmp = $dir.FullName
          $q = Start-Process -FilePath (Join-Path $tmp 'vpnsetup.exe') -WorkingDirectory $tmp -PassThru
          Start-Sleep -Seconds 6
          $q.Refresh()
          "direct output windows (cpu=$([math]::Round($q.TotalProcessorTime.TotalSeconds,2)) exited=$($q.HasExited)):"
          [Win]::Windows([uint32]$q.Id) | ForEach-Object { "  $_" }
          "temp after direct run: $(Files $tmp)"
          Stop-Process -Id $q.Id -Force -ErrorAction SilentlyContinue
