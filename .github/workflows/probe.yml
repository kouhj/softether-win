name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Fetch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/kouhj/softether-win/releases/download/5.2.5189/softether-vpnclient-5.02.5189.x64.exe' -OutFile 'probe\ours.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/softethervpn/softethervpn/releases/download/5.2.5189/softether-vpnclient-5.02.5187.x64.exe' -OutFile 'probe\official.exe'
      - name: Compare the two exes
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;

          public class Res
          {
              [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll")]
              static extern bool FreeLibrary(IntPtr module);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr FindResourceA(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr FindResourceW(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr LoadResource(IntPtr module, IntPtr res);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr LockResource(IntPtr data);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint SizeofResource(IntPtr module, IntPtr res);

              public static string Dump(string path, int id, int type)
              {
                  IntPtr h = LoadLibraryExW(path, IntPtr.Zero, 2);
                  IntPtr r = FindResourceA(h, (IntPtr)id, (IntPtr)type);
                  if (r == IntPtr.Zero) { FreeLibrary(h); return "missing"; }
                  uint size = SizeofResource(h, r);
                  byte[] buf = new byte[size];
                  Marshal.Copy(LockResource(LoadResource(h, r)), buf, 0, (int)size);
                  FreeLibrary(h);
                  return size + " bytes sha256=" + Convert.ToHexString(System.Security.Cryptography.SHA256.HashData(buf)).Substring(0, 16);
              }
          }
          '@
          foreach ($f in @('probe\ours.exe', 'probe\official.exe')) {
            $p = (Resolve-Path $f).Path
            $i = Get-Item $p
            $sig = (Get-AuthenticodeSignature $p).Status
            "{0}: size={1} modified={2:yyyy-MM-dd} sig={3}" -f $i.Name, $i.Length, $i.LastWriteTime, $sig
            "  manifest(24,id1)=$([Res]::Dump($p, 1, 24))"
            "  dialog(5,10002)=$([Res]::Dump($p, 10002, 5))"
            "  version(16,id1)=$([Res]::Dump($p, 1, 16))"
          }

      - name: Run ours three times
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class Win
          {
              public delegate bool Proc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(Proc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);

              public static bool HasDialog(uint pid)
              {
                  bool found = false;
                  EnumWindows((h, l) =>
                  {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid)
                      {
                          var c = new StringBuilder(256);
                          GetClassNameW(h, c, 256);
                          if (c.ToString() == "#32770") { found = true; return false; }
                      }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@
          function Run([string]$exe) {
            $p = Start-Process -FilePath $exe -PassThru
            $trace = @()
            for ($i = 0; $i -lt 5; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              $dir = Get-ChildItem (Join-Path $env:TEMP 'VPN_*') -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              $files = if ($dir) { (Get-ChildItem $dir.FullName -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ' ' } else { '-' }
              $kids = (Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | Measure-Object).Count
              $trace += "t=$($i+1) cpu=$([math]::Round($p.TotalProcessorTime.TotalSeconds,2)) kids=$kids dlg=$([Win]::HasDialog([uint32]$p.Id)) files=$files"
            }
            if ($p.HasExited -eq $false) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Get-Process -Name vpnsetup -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            Remove-Item (Join-Path $env:TEMP 'VPN_*') -Recurse -Force -ErrorAction SilentlyContinue
            "=== $([IO.Path]::GetFileName($exe))"
            $trace
          }
          Run 'probe\ours.exe'
          Run 'probe\ours.exe'
          Run 'probe\official.exe'
          Run 'probe\ours.exe'
