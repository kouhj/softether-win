name: mp

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Download the assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          gh release download 5.2.5189 -R kouhj/softether-win -p 'softether-win-5.2.5189-x64.zip' -D probe --clobber
          gh release download 5.2.5189 -R softethervpn/softethervpn -p 'softether-vpnclient-5.02.5187.x64.exe' -D probe --clobber
          Expand-Archive probe/softether-win-5.2.5189-x64.zip -DestinationPath probe/zip -Force
          Get-ChildItem probe -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Defender status and scan
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, AntivirusSignatureVersion, AMEngineVersion | Format-List
          $mp = Get-ChildItem "$env:ProgramFiles\Windows Defender\MpCmdRun.exe", "C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          "mpcmdrun: $($mp.FullName)"
          $files = @(
            'probe\zip\softether-win-5.2.5189-x64\vpnsetup.exe',
            'probe\zip\softether-win-5.2.5189-x64\vpncmgr.exe',
            'probe\softether-vpnclient-5.02.5187.x64.exe'
          )
          foreach ($f in $files) {
            "=== scan $f"
            & $mp.FullName -Scan -ScanType 3 -File (Resolve-Path $f).Path 2>&1 | Select-Object -Last 15
            "exit=$LASTEXITCODE"
          }

      - name: Threat history
        shell: pwsh
        run: |
          "--- detections"
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Sort-Object InitialDetectionTime -Descending | Select-Object -First 10 InitialDetectionTime, ThreatID, @{ n = 'resources'; e = { $_.Resources -join ';' } } | Format-List
          "--- threats"
          Get-MpThreat -ErrorAction SilentlyContinue | Select-Object -First 10 ThreatName | Format-List
