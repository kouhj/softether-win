name: build-win

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  SOFTETHER_VERSION: '5.2.5189'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          # the manifest build installs into VCPKG_INSTALLED_DIR, which is the
          # directory configured below
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ env.SOFTETHER_VERSION }}

      - name: Fetch, patch and prepare the source
        run: python scripts/prepare-source.py

      - name: Configure
        run: |
          # OQS_ENABLE=OFF: the vendored oqs-provider does not compile with
          # MSVC (error C7757, an empty initializer for an array of unknown
          # size); the code has a SKIP_OQS_PROVIDER path for this case
          cmake -S source -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" `
            -DOQS_ENABLE=OFF `
            -DCMAKE_BUILD_TYPE=Release
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify the feature is in the binary
        run: |
          # the build must contain both halves of the feature: the tray entry
          # from CM.c and the editor from netrule.c
          $exe = "build\Release\vpncmgr.exe"
          if (-not (Test-Path $exe)) { throw "vpncmgr.exe was not built" }
          $text = [System.Text.Encoding]::Unicode.GetString([System.IO.File]::ReadAllBytes($exe))
          $missing = @()
          foreach ($needle in @("Network connection rules", "NrRulesWindow", "net_rules.ini", "netsh wlan show interfaces")) {
            if (-not $text.Contains($needle)) { $missing += $needle }
          }
          if ($missing.Count -gt 0) { throw "missing in vpncmgr.exe: $($missing -join ', ')" }
          "all feature strings are present in vpncmgr.exe"

      - name: Collect the binaries
        run: |
          # an allowlist: the build tree also holds CMake probes such as
          # build\CMakeFiles\3.31.6\CompilerIdC\CompilerIdC.exe and the
          # hamcorebuilder tool, neither of which belongs in a release
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $wanted = @(
            "vpncmgr.exe", "vpnclient.exe", "vpnserver.exe", "vpnbridge.exe",
            "vpncmd.exe", "vpnsetup.exe", "vpnsmgr.exe", "hamcore.se2"
          )
          foreach ($name in $wanted) {
            $file = Get-ChildItem build -Filter $name -Recurse -File | Select-Object -First 1
            if (-not $file) { throw "$name was not built" }
            Copy-Item $file.FullName -Destination out
          }
          Get-ChildItem out | Select-Object Name, Length | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: softether-win-${{ env.SOFTETHER_VERSION }}
          path: out/*
          if-no-files-found: error

  # Tag pushes also publish a release: the binaries are zipped together with
  # hamcore.se2 so the archive can be unpacked over an existing installation.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          name: softether-win-${{ env.SOFTETHER_VERSION }}
          path: dist

      - name: Pack and checksum
        run: |
          set -eu
          name="softether-win-${SOFTETHER_VERSION}-x64"
          mv dist "$name"
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" >SHA256SUMS
          ls -l

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          zipname="softether-win-${SOFTETHER_VERSION}-x64.zip"
          cat >notes.md <<EOF
          SoftEther VPN ${SOFTETHER_VERSION}, built from the official upstream
          release with MSVC (x64, static CRT) plus one local patch and one local
          feature.

          Patch: the two assignments of \`is_restricted\` in
          \`src/Cedar/Server.c\` are commented out, so the enterprise feature
          flags (push route, RADIUS, certificate auth, deep logging, access
          control, syslog) stay enabled.

          Feature: network connection rules, a tray menu entry
          (*Network connection rules...*) in \`vpncmgr.exe\` that connects or
          disconnects a VPN Client connection depending on the Wi-Fi SSID or the
          Ethernet default gateway. Rules live in
          \`%ProgramData%\SoftEther VPN Client\net_rules.ini\`.

          The archive holds \`vpncmgr.exe\`, \`vpnclient.exe\`, \`vpnserver.exe\`,
          \`vpnbridge.exe\`, \`vpncmd.exe\`, \`vpnsetup.exe\`, \`vpnsmgr.exe\` and
          \`hamcore.se2\`; unpack it over an existing installation of the same
          version.

          Not verified on a real desktop yet: see the smoke test in the README.
          EOF
          # no checkout in this job, so tell gh which repository it is
          REPO="$GITHUB_REPOSITORY"
          # ask the API instead of `gh release view`: the API also lists drafts,
          # which is what a release becomes when its tag is deleted and pushed
          # again, and an unnoticed draft is invisible to everybody
          rel_id=$(gh api "repos/$REPO/releases?per_page=100" \
            -q ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -n "$rel_id" ]; then
            gh api "repos/$REPO/releases/$rel_id/assets" -q '.[] | "\(.id) \(.name)"' |
              while read -r id name; do
                [ "$name" = "$zipname" ] || [ "$name" = SHA256SUMS ] ||
                  gh api -X DELETE "repos/$REPO/releases/assets/$id"
              done
            gh api -X PATCH "repos/$REPO/releases/$rel_id" -f draft=false >/dev/null
            gh release upload "$TAG" -R "$REPO" "$zipname" SHA256SUMS --clobber
          else
            gh release create "$TAG" -R "$REPO" "$zipname" SHA256SUMS \
              --title "SoftEther VPN ${SOFTETHER_VERSION} (patched, Windows x64)" \
              --notes-file notes.md
          fi
          gh release view "$TAG" -R "$REPO" --json url -q .url
