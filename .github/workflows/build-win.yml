name: build-win

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  SOFTETHER_VERSION: '5.2.5189'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the install script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          # a dry run must not need admin rights or download anything
          ./scripts/install.ps1 -DryRun
          "the install script parses and its dry run succeeded"

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          # the manifest build installs into VCPKG_INSTALLED_DIR, which is the
          # directory configured below
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ env.SOFTETHER_VERSION }}

      - name: Fetch, patch and prepare the source
        run: python scripts/prepare-source.py

      - name: Configure
        run: |
          # OQS_ENABLE=OFF: the vendored oqs-provider does not compile with
          # MSVC (error C7757, an empty initializer for an array of unknown
          # size); the code has a SKIP_OQS_PROVIDER path for this case
          cmake -S source -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" `
            -DOQS_ENABLE=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXE_LINKER_FLAGS="/MAP"
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify the feature is in the binary
        run: |
          # the build must contain both halves of the feature: the tray entry
          # from CM.c and the editor from netrule.c
          $exe = "build\Release\vpncmgr.exe"
          if (-not (Test-Path $exe)) { throw "vpncmgr.exe was not built" }
          $text = [System.Text.Encoding]::Unicode.GetString([System.IO.File]::ReadAllBytes($exe))
          $missing = @()
          foreach ($needle in @("Network connection rules", "NrRulesWindow", "net_rules.ini", "netsh wlan show interfaces")) {
            if (-not $text.Contains($needle)) { $missing += $needle }
          }
          if ($missing.Count -gt 0) { throw "missing in vpncmgr.exe: $($missing -join ', ')" }
          "all feature strings are present in vpncmgr.exe"

      - name: Collect the binaries
        run: |
          # an allowlist: the build tree also holds CMake probes such as
          # build\CMakeFiles\3.31.6\CompilerIdC\CompilerIdC.exe and the
          # hamcorebuilder tool, neither of which belongs in a release
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $wanted = @(
            "vpncmgr.exe", "vpnclient.exe", "vpnserver.exe", "vpnbridge.exe",
            "vpncmd.exe", "vpnsetup.exe", "vpnsmgr.exe", "hamcore.se2"
          )
          foreach ($name in $wanted) {
            $file = Get-ChildItem build -Filter $name -Recurse -File | Select-Object -First 1
            if (-not $file) { throw "$name was not built" }
            Copy-Item $file.FullName -Destination out
          }
          Get-ChildItem out | Select-Object Name, Length | Format-Table

      # the official release ships one self-extracting installer per component,
      # generated by vpnsetup.exe itself (see scripts/build-installers.ps1)
      - name: Build the installers
        run: ./scripts/build-installers.ps1 -Version $env:SOFTETHER_VERSION -BinDir out -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: softether-win-${{ env.SOFTETHER_VERSION }}
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: softether-installers-${{ env.SOFTETHER_VERSION }}
          path: dist/*
          if-no-files-found: error

      # the map is not shipped; it lets a debugging run name the functions a
      # sampling probe sees in vpnsetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: softether-map
          path: build/Release/vpnsetup.map
          if-no-files-found: warn

  # Tag pushes also publish a release: two installers built the way the
  # official release is built, plus the archive for upgrading an existing
  # installation.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the packaging step needs scripts/install.ps1, which lives in the repo
      - uses: actions/checkout@v4

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          name: softether-win-${{ env.SOFTETHER_VERSION }}
          path: dist

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: softether-installers-${{ env.SOFTETHER_VERSION }}
          path: installers

      - name: Collect the release assets
        run: |
          set -eu
          name="softether-win-${SOFTETHER_VERSION}-x64"
          mkdir -p assets
          mv dist "$name"
          # inside the archive, so an unpacked copy can be installed from its own
          # directory; and beside it, so the release is usable without unpacking
          cp scripts/install.ps1 "$name/install.ps1"
          zip -r "assets/$name.zip" "$name"
          unzip -l "assets/$name.zip" | grep -q "install.ps1" || {
            echo "install.ps1 is missing from the archive"; exit 1; }
          cp scripts/install.ps1 assets/install.ps1
          cp installers/*.exe assets/
          ( cd assets && sha256sum *.zip *.ps1 *.exe >SHA256SUMS )
          ls -l assets

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="$SOFTETHER_VERSION" FILE_VERSION="5.02.${SOFTETHER_VERSION##5.2.}" \
            python3 - <<'PY'
          import os
          text = open("docs/RELEASE_NOTES.md", encoding="utf-8").read()
          text = text.replace("{{VERSION}}", os.environ["VERSION"])
          text = text.replace("{{FILE_VERSION}}", os.environ["FILE_VERSION"])
          open("notes.md", "w", encoding="utf-8").write(text)
          PY
          # no checkout in this job, so tell gh which repository it is
          REPO="$GITHUB_REPOSITORY"
          # ask the API instead of `gh release view`: the API also lists drafts,
          # which is what a release becomes when its tag is deleted and pushed
          # again, and an unnoticed draft is invisible to everybody
          rel_id=$(gh api "repos/$REPO/releases?per_page=100" \
            -q ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -n "$rel_id" ]; then
            # anything that is not an asset of this build is left over from an
            # earlier one
            gh api "repos/$REPO/releases/$rel_id/assets" -q '.[] | "\(.id) \(.name)"' |
              while read -r id asset; do
                [ -f "assets/$asset" ] ||
                  gh api -X DELETE "repos/$REPO/releases/assets/$id"
              done
            gh api -X PATCH "repos/$REPO/releases/$rel_id" \
              -F draft=false -F body=@notes.md >/dev/null
            gh release upload "$TAG" -R "$REPO" assets/* --clobber
          else
            gh release create "$TAG" -R "$REPO" assets/* \
              --title "SoftEther VPN ${SOFTETHER_VERSION} (patched, Windows x64)" \
              --notes-file notes.md
          fi
          gh release view "$TAG" -R "$REPO" --json url -q .url
